[package]
name = "corgi-rs"
version = "0.1.4"
edition = "2024"
description = "Vehicle VIN decoding library based on NHTSA database for Rust"
keywords = ["nhtsa", "vin", "vehicles", "decoding"]
categories = ["automotive", "parsing", "encoding"]
license = "MIT"

[dependencies]
sqlx = {version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros"]}
chrono = "0.4.43"
dirs = "6.0.0"
futures = "0.3.32"

[build-dependencies]
ureq = "3.2.0"
flate2 = "1.1.9"
dirs = "6.0.0"

[dev-dependencies]
tokio = {version = "1.49.0", features = ["full"]}
